<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Tic Tac Toe Game</title>

<!-- Connect CSS -->
<link rel="stylesheet" href="style.css">

<!-- Connect JavaScript -->
<script src="script.js" defer></script>
```

</head>

<body>

```
<main class="game-container">

    <h1>⭕ Tic Tac Toe</h1>
    <p class="subtitle">Choose your mode and start playing!</p>

    <!-- Game Modes -->
    <div class="mode-buttons">
        <button id="twoPlayerBtn" class="mode-btn active">
            2 Players
        </button>

        <button id="computerBtn" class="mode-btn">
            Vs Computer
        </button>
    </div>

    <!-- Game Status -->
    <h2 id="status" aria-live="polite">Player X's turn</h2>

    <!-- Game Board -->
    <div class="board" id="board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>

        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>

        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <!-- Scoreboard -->
    <div class="scores">

        <div class="score-box">
            <p>Player X</p>
            <h2 id="scoreX">0</h2>
        </div>

        <div class="score-box">
            <p>Player O</p>
            <h2 id="scoreO">0</h2>
        </div>

        <div class="score-box">
            <p>Draws</p>
            <h2 id="scoreDraw">0</h2>
        </div>

    </div>

    <!-- Game Controls -->
    <div class="action-buttons">
        <button id="restartBtn" class="restart-btn">
            ↻ Restart
        </button>

        <button id="resetBtn" class="reset-btn">
            Reset Scores
        </button>
    </div>

    <!-- Winner Popup -->
    <div
        id="winnerPopup"
        class="winner-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="winnerMessage"
    >
        <div class="popup-content">

            <div class="trophy">🏆</div>

            <h2 id="winnerMessage">Player X Wins!</h2>

            <p id="popupDescription">Congratulations!</p>

            <button id="playAgainBtn" class="play-again-btn">
                Play Again ↻
            </button>

        </div>
    </div>

</main>
```

</body>
</html>
